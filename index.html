 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated Citation Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h2>📚 Citation Generator</h2>

    <input type="text" id="author" placeholder="Author Name">
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="year" placeholder="Year">
    <input type="text" id="url" placeholder="URL">

    <select id="style">
      <option value="APA">APA</option>
      <option value="MLA">MLA</option>
      <option value="Chicago">Chicago</option>
    </select>

    <button onclick="generateCitation()">Generate Citation</button>

    <div class="output" id="output"></div>
    <button class="copy-btn" onclick="copyCitation()">Copy Citation</button>

    <div class="recent-header">
      <h3>Recent Searches</h3>
      <button id="clearHistory">Clear</button>
    </div>

    <ul id="recentList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
